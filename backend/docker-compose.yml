services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: csbetz
      POSTGRES_PASSWORD: csbetz_dev_password
      POSTGRES_DB: csbetz
    ports:
      - '5432:5432'
    volumes:
      - csbetz_postgres_data:/var/lib/postgresql/data

volumes:
  csbetz_postgres_data: